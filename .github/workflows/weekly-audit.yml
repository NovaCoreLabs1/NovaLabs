name: Weekly Security Audit

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  npm-audit:
    name: npm audit (frontend + backend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit frontend dependencies
        id: frontend-audit
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate --json > /tmp/frontend-audit.json || true
          HIGH=$(cat /tmp/frontend-audit.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('high',0)+d.get('metadata',{}).get('vulnerabilities',{}).get('critical',0))")
          echo "high_critical=$HIGH" >> $GITHUB_OUTPUT

      - name: Audit backend dependencies
        id: backend-audit
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate --json > /tmp/backend-audit.json || true
          HIGH=$(cat /tmp/backend-audit.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metadata',{}).get('vulnerabilities',{}).get('high',0)+d.get('metadata',{}).get('vulnerabilities',{}).get('critical',0))")
          echo "high_critical=$HIGH" >> $GITHUB_OUTPUT

  cargo-audit:
    name: cargo audit (contracts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: contracts
        run: cargo audit

  license-check:
    name: License compliance check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install license-checker (frontend)
        run: npm install -g license-checker

      - name: Check frontend licenses
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          license-checker --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;Unlicense;Python-2.0;BlueOak-1.0.0" --excludePrivatePackages

      - name: Check backend licenses
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          license-checker --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;Unlicense;Python-2.0;BlueOak-1.0.0" --excludePrivatePackages

  create-issue-on-failure:
    name: Open tracking issue on failure
    runs-on: ubuntu-latest
    needs: [npm-audit, cargo-audit, license-check]
    if: failure()
    steps:
      - name: Create weekly-audit issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[weekly-audit] Security / licence findings — ${today}`,
              body: [
                '## Weekly Audit Failure',
                '',
                `**Run:** [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                `**Date:** ${today}`,
                '',
                '### Action Required',
                '- Review the failed job(s) in the linked workflow run.',
                '- Resolve any high/critical `npm audit` or `cargo audit` findings.',
                '- Ensure all dependency licenses remain compliant.',
                '',
                '> Auto-generated by the Weekly Security Audit workflow.',
              ].join('\n'),
              labels: ['security', 'weekly-audit'],
            });
