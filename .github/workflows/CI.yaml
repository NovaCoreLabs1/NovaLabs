  # ─────────────────────────────────────────────
  # BACKEND — NestJS
  # ─────────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript check)
        run: npm run build

      - name: Unit tests
        run: npm run test -- --passWithNoTests

  # ─────────────────────────────────────────────
  # FRONTEND — Next.js
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  # ─────────────────────────────────────────────
  # SENTRY — Source Map Upload (on release tags)
  # ─────────────────────────────────────────────
  sentry-sourcemaps:
    name: Sentry Source Maps Upload
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Sentry CLI
        run: npm install -g @sentry/cli

      - name: Build Backend with Source Maps
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Upload Backend Source Maps
        working-directory: backend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_BACKEND_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            sentry-cli releases new backend@${{ github.ref_name }}
            sentry-cli releases files backend@${{ github.ref_name }} upload-sourcemaps ./dist --ext js --ext map
            sentry-cli releases finalize backend@${{ github.ref_name }}
          else
            echo "SENTRY_AUTH_TOKEN not set, skipping source map upload"
          fi

      - name: Build Frontend with Source Maps
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
        run: |
          npm ci
          npm run build

      - name: Upload Frontend Source Maps
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            sentry-cli releases new frontend@${{ github.ref_name }}
            sentry-cli releases files frontend@${{ github.ref_name }} upload-sourcemaps ./.next --ext js --ext map
            sentry-cli releases finalize frontend@${{ github.ref_name }}
          else
            echo "SENTRY_AUTH_TOKEN not set, skipping source map upload"
          fi
